{% extends 'base.html' %}
{% block title %}Login — Surveillance System{% endblock %}

{% block auth_content %}
<div class="flex items-center justify-center min-h-screen px-4">
  <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white">Surveillance System</h1>
      <p class="text-slate-400 text-sm mt-1">Sign in to continue</p>
    </div>

    {% if form.errors %}
    <div class="bg-red-500/10 border border-red-500/40 text-red-300 text-sm rounded-lg p-3 mb-4">
      Invalid username or password. Please try again.
    </div>
    {% endif %}

    <form method="post" class="space-y-5">
      {% csrf_token %}
      <div>
        <label class="block text-sm text-slate-300 mb-1">Username</label>
        <input type="text" name="username" required
               class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg
                      text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1">Password</label>
        <input type="password" name="password" required
               class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg
                      text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-500 transition-colors
                     text-white font-medium py-2.5 rounded-lg">
        Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
